<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pigeon lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd6dc; font: 13px/1.3 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
      #ui button, #ui label { pointer-events: auto; background: rgba(255,255,255,0.85); border: 1px solid #889; border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; }
      #ui button:focus-visible { outline: 2px solid #135; }
      #ui .sel { background: #234; color: #fff; }
      #stats { position: fixed; left: 8px; bottom: 8px; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="stats"></div>
    <script type="module" src="./pigeon.ts"></script>
  </body>
</html>
